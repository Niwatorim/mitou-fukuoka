component: img
url: http://localhost:5173/
test_steps:
- step: 1
  action: navigate
  instruction: Open the application
  target: http://localhost:5173/
  expected: Page loads successfully
- step: 2
  action: verify
  instruction: Verify that the React logo image is present on the page.
  selector: img.logo.react
  expected: The image with class 'logo react' is displayed.
- step: 3
  action: verify
  instruction: Verify the 'src' attribute of the React logo image.
  selector: img.logo.react[src*='react.svg']
  expected: The image's 'src' attribute points to the React logo asset.
- step: 4
  action: verify
  instruction: Verify the 'alt' attribute of the React logo image.
  selector: img.logo.react[alt='React logo']
  expected: The image's 'alt' attribute is correctly set to 'React logo'.
