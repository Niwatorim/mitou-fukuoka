component: button
url: http://localhost:5173/
test_steps:
- step: 1
  action: navigate
  instruction: Open the application
  target: http://localhost:5173/
  expected: Page loads successfully
- step: 2
  action: verify
  instruction: Verify the initial count displayed is 0
  selector: 'text="Count is: 0"'
  expected: 'Element displaying ''Count is: 0'' is visible on the page'
- step: 3
  action: click
  instruction: Click the button to increment the count
  selector: button
  expected: The button is clicked and the count increment function is called
- step: 4
  action: verify
  instruction: Verify the count has incremented to 1
  selector: 'text="Count is: 1"'
  expected: 'Element displaying ''Count is: 1'' is visible on the page'
