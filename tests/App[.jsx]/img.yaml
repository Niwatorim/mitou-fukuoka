component: img
url: http://localhost:5173/
test_steps:
- step: 1
  action: navigate
  instruction: Open the application
  target: http://localhost:5173/
  expected: Page loads successfully
- step: 2
  action: verify
  instruction: Verify the 'img' component with class 'logo' is visible
  selector: img.logo
  expected: The image element with class 'logo' should be visible on the page
- step: 3
  action: verify
  instruction: Verify the 'src' attribute of the 'img' component with class 'logo'
  selector: img.logo
  attribute: src
  expected: The 'src' attribute should contain 'viteLogo' (or its resolved path)
- step: 4
  action: verify
  instruction: Verify the 'alt' attribute of the 'img' component with class 'logo'
  selector: img.logo
  attribute: alt
  expected: The 'alt' attribute should be 'Vite logo'
