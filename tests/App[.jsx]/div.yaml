component: div
url: http://localhost:5173/
test_steps:
- step: 1
  action: navigate
  instruction: Open the application
  target: http://localhost:5173/
  expected: Page loads successfully
- step: 2
  action: verify
  instruction: Verify the div component with class "card" is present
  selector: .card
  expected: The div element with class "card" should be visible on the page
- step: 3
  action: click
  instruction: Click the button inside the card to increment the count
  selector: .card button
  expected: The button inside the card should be clickable and trigger the count increment
